# Every action is pinned to a commit, with the release in a trailing comment.
#
# A tag is a movable pointer. `@v4` means "whatever the owner of that repository last
# decided v4 should be", and these jobs run with a checkout of ours — an action that is
# retargeted, or a maintainer account that is taken over, executes with our source in the
# working directory. On release.yml it would execute beside the ed25519 signing key.
#
# That was already the argument written next to setup-php below, and then the argument was
# not applied to anything else. The quality gate noticed before we did.
#
# The trailing `# vX.Y.Z` is not decoration: Dependabot reads it, and .github/dependabot.yml
# watches github-actions weekly, so a pin here is updated deliberately rather than left to
# rot. Resolve a new one with:
#
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      # v8 installs the golangci-lint v2 line. v6 resolves `latest` to the v1 line,
      # which is built with Go 1.24 and refuses to read a module targeting 1.25:
      # "the Go language version (go1.24) used to build golangci-lint is lower than
      # the targeted Go version". The config moved to the v2 schema with it.
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: latest

  # The PHP bridge was shipping unchecked.
  #
  # It is the only thing standing between a visitor and the panel on hosting with no
  # shell, it runs on the account being protected, and nothing in CI had ever parsed it.
  # A syntax error would have reached the live host and taken the panel down completely —
  # and the bridge is precisely what you would use to find out why the panel is down.
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The only pin whose comment is a bare major: this commit matches no published
      # tag of setup-php, so there is no precise version to name. It is what v2
      # dereferenced to when the job was written.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'   # the oldest cPanel still offers; newer must not be required
      - name: Syntax
        run: find contrib/php-bridge -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: |
          for t in contrib/php-bridge/tests/*.php; do
            echo "--- $t"
            php "$t"
          done

  # The one check that cannot be done offline.
  #
  # Everything else about a catalogue entry is validated from the manifest alone, which
  # means a reviewer merging a submission would be trusting one field they cannot see: the
  # digest. This downloads each pinned URL and compares. It is also how a pin that has
  # stopped resolving gets noticed here rather than on somebody's account.
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Every pinned digest matches what is actually there
        env:
          SENTINELHOST_ONLINE: "1"
        run: go test ./internal/catalog/ -count=1 -run TestEveryPinnedDigestMatches -v

  # Nothing was compiling the Windows files.
  #
  # links_windows.go, exec_windows.go and owner_windows.go exist so the suite runs on a
  # maintainer's workstation — production is Linux. But the release builds only for Linux
  # and CI runs only on ubuntu, so a break in one of those files was invisible to everyone
  # except whoever happened to run the suite locally. Compiling them costs seconds.
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: The Windows-tagged files still compile
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build ./... && go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test ./... -count=1
      - name: Tests with the race detector
        run: go test ./... -race -count=1 -short
      # These skip on a Windows workstation, so this is the only place they run. Named
      # explicitly and verbosely: a skipped test and a passing one are the same line in
      # `go test` output without -v, and this repository has twice been caught by a green
      # suite on Windows saying nothing about POSIX behaviour.
      - name: The POSIX-only quarantine checks actually ran
        run: |
          go test ./internal/quarantine/ -count=1 -v             -run 'HardLinked|Symlink|PlainFileIsStill' | tee /tmp/posix.log
          grep -q -- '--- PASS: TestAHardLinkedFileIsNotQuarantinedSilently' /tmp/posix.log
          grep -q -- '--- PASS: TestASymlinkIsRefusedRatherThanUnlinked' /tmp/posix.log
      # Same reasoning, different subject: creating a symlink needs a privilege the
      # Windows process does not have, so these skip on a workstation and this is the
      # only place they run. Asserted by name, because `ok` on a package whose tests all
      # skipped looks exactly like `ok` on a package whose tests all passed.
      - name: The symlinked-directory accounting actually ran
        run: |
          go test ./internal/baseline/ ./internal/adapter/wpchecksums/ -count=1 -v             -run 'Symlink|LinkInto' | tee /tmp/symlink.log
          grep -q -- '--- PASS: TestASymlinkedDirectoryIsNotCountedAsOneSkippedFile' /tmp/symlink.log
          grep -q -- '--- PASS: TestASymlinkToADirectoryInsideTheRootLosesNoCoverage' /tmp/symlink.log
          grep -q -- '--- PASS: TestASymlinkedDirectoryIsReportedRatherThanIgnored' /tmp/symlink.log
          grep -q -- '--- PASS: TestARootThatIsItselfASymlinkStillResolves' /tmp/symlink.log
          grep -q -- '--- PASS: TestALinkIntoAlreadyCoveredGroundIsNotReportedAsAGap' /tmp/symlink.log
          grep -q -- '--- PASS: TestALinkIntoTheSearchedTreeIsNotReportedAsADoorLeftClosed' /tmp/symlink.log
      # Also POSIX-only: it asserts the mode of a file, and Windows has no opinion on that.
      - name: The kept configuration copy is not world-readable
        run: |
          go test ./internal/config/ -count=1 -v -run 'KeptCopy' | tee /tmp/perms.log
          grep -q -- '--- PASS: TestTheKeptCopyIsNotWorldReadable' /tmp/perms.log

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Static build for linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o dist/sentinelhost-linux-${{ matrix.goarch }} ./cmd/sentinelhost
      - name: Confirm that the binary is static
        if: matrix.goarch == 'amd64'
        run: |
          file dist/sentinelhost-linux-amd64
          ! (file dist/sentinelhost-linux-amd64 | grep -q "dynamically linked")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sentinelhost-linux-${{ matrix.goarch }}
          path: dist/sentinelhost-linux-${{ matrix.goarch }}
