name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # The PHP bridge was shipping unchecked.
  #
  # It is the only thing standing between a visitor and the panel on hosting with no
  # shell, it runs on the account being protected, and nothing in CI had ever parsed it.
  # A syntax error would have reached the live host and taken the panel down completely —
  # and the bridge is precisely what you would use to find out why the panel is down.
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit, not to `@v2`. A tag is a movable pointer: whoever controls the
      # repository can retarget it, and this job runs with a checkout of ours. f3e473d is
      # what v2 dereferenced to when this was added.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'   # the oldest cPanel still offers; newer must not be required
      - name: Syntax
        run: find contrib/php-bridge -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: |
          for t in contrib/php-bridge/tests/*.php; do
            echo "--- $t"
            php "$t"
          done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: Tests
        run: go test ./... -count=1
      - name: Tests with the race detector
        run: go test ./... -race -count=1 -short

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Static build for linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o dist/sentinelhost-linux-${{ matrix.goarch }} ./cmd/sentinelhost
      - name: Confirm that the binary is static
        if: matrix.goarch == 'amd64'
        run: |
          file dist/sentinelhost-linux-amd64
          ! (file dist/sentinelhost-linux-amd64 | grep -q "dynamically linked")
      - uses: actions/upload-artifact@v4
        with:
          name: sentinelhost-linux-${{ matrix.goarch }}
          path: dist/sentinelhost-linux-${{ matrix.goarch }}
