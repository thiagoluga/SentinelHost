name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go vet
        run: go vet ./...
      - name: Testes
        run: go test ./... -count=1
      - name: Testes com detector de corrida
        run: go test ./... -race -count=1 -short

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build estatico linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o dist/sentinelhost-linux-${{ matrix.goarch }} ./cmd/sentinelhost
      - name: Confirmar que o binario e estatico
        if: matrix.goarch == 'amd64'
        run: |
          file dist/sentinelhost-linux-amd64
          ! (file dist/sentinelhost-linux-amd64 | grep -q "dynamically linked")
      - uses: actions/upload-artifact@v4
        with:
          name: sentinelhost-linux-${{ matrix.goarch }}
          path: dist/sentinelhost-linux-${{ matrix.goarch }}
