# Build, sign and publish a release.
#
# The signature is the point. install.sh checks a SHA256SUMS file fetched from the same
# place as the binary, which catches a corrupted transfer and nothing else — whoever can
# serve the binary can serve the checksum. `sentinelhost update` therefore verifies an
# ed25519 signature against a key compiled into the binary already running, so replacing a
# release means stealing a key that never touches this repository.
#
# The private key lives in the repository secret SENTINELHOST_RELEASE_KEY and is never
# printed, never written to a file that outlives the step, and never used for anything but
# signing these assets.
#
# Which is why the actions below are pinned to commits rather than tags, and why this is
# the workflow where it matters most. A step here runs in the same job as that secret. A
# tag like `@v4` is a movable pointer: the owner of that repository decides at any moment
# what it dereferences to, and an account takeover upstream would put somebody else's code
# next to the key that signs what users install. The pin is the difference between
# trusting a commit we looked at and trusting a name.
#
# Updated by Dependabot, which reads the trailing version comment — see
# .github/dependabot.yml. The full rationale is at the top of ci.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: "1.25"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history and every ref: the check below compares the tag against
          # main, and a shallow clone has neither.
          fetch-depth: 0

      # Does this tag contain what the release will claim it contains?
      #
      # Written after v0.1.9 shipped without a fix that had been merged: the release was
      # built, signed and installed on a real account, and the WordPress search fix was not
      # in it. Nothing failed — the suite ran against the tag and was green, for a tree
      # missing the change. It surfaced later as a second `## Unreleased` heading.
      #
      # Being precise about what these checks do and do not catch, because overstating a
      # guard is how the next person stops looking:
      #
      #   - None of them would have fired when v0.1.9 was tagged. At that moment the tag
      #     WAS the tip of main and the changelog WAS correct. The fix merged afterwards
      #     and no new release was cut, which no tag-time check can see.
      #   - What check 3 does catch is the aftermath. The orphaned `## Unreleased` section
      #     that merge left behind would have failed the NEXT release, instead of sitting
      #     there for two releases the way it did.
      #   - Check 1 catches the neighbouring mistake, which is real and easier to make:
      #     tagging a commit while main has moved past it.
      #
      # The discipline that actually prevents the original — cut a release after a merge,
      # not before — is not enforceable here. This narrows the blast radius; it does not
      # replace it.
      #
      # A release is the one artifact users install without being able to check it. Every
      # other gate in this repository guards a pull request; this guards what leaves the
      # building.
      - name: The tag contains everything on main, and the changelog says which release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          git fetch --quiet origin main

          # 1. Commits on main that this tag does not contain.
          #
          # Failing rather than warning. A warning is what the last one was: printed,
          # true, and read past. `[allow-behind-main]` in the tag message is the way to
          # release deliberately from behind main — a hotfix from an older tag is a real
          # thing, and it should have to be said out loud.
          BEHIND=$(git rev-list --count "${TAG}..origin/main")
          if [ "${BEHIND}" -gt 0 ]; then
            echo "::group::commits on main that ${TAG} does NOT contain"
            git log --oneline "${TAG}..origin/main"
            echo "::endgroup::"
            if git tag -l --format='%(contents)' "${TAG}" | grep -q '\[allow-behind-main\]'; then
              echo "::warning::${TAG} is ${BEHIND} commit(s) behind main, allowed by the tag message."
            else
              echo "::error::${TAG} is ${BEHIND} commit(s) behind main. Those changes will not"
              echo "::error::be in the release, and its notes will imply they are. Re-tag at main,"
              echo "::error::or put [allow-behind-main] in the tag message if that is deliberate."
              exit 1
            fi
          fi

          # 2. The changelog's newest heading is this release.
          TOP=$(grep -m1 '^## ' CHANGELOG.md | sed 's/^## //')
          if [ "${TOP}" != "${TAG}" ]; then
            echo "::error::CHANGELOG.md's newest section is '${TOP}', but the tag is '${TAG}'."
            echo "::error::A release whose notes describe a different version is worse than none."
            exit 1
          fi

          # 3. No section is still called Unreleased.
          #
          # An Unreleased heading at tag time means something merged that this release's
          # notes do not describe. That is exactly the shape the v0.1.9 miss left behind.
          if grep -q '^## Unreleased' CHANGELOG.md; then
            echo "::error::CHANGELOG.md still has an '## Unreleased' section. Something merged"
            echo "::error::that these release notes do not cover — fold it in or cut it separately."
            exit 1
          fi

          echo "${TAG} contains all of main, and the changelog names it."

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # A tag that has not passed the gate must not become a release. Re-running the suite
      # here rather than trusting that the branch was green: the tag may point somewhere
      # the branch protection never saw.
      - name: The suite, on the exact commit being released
        run: |
          go vet ./...
          go test ./... -count=1

      - name: Build
        env:
          # The PUBLIC key is compiled in. A build with none refuses to self-update rather
          # than trusting whatever it is handed, so an empty secret produces a release that
          # cannot update itself — visible, and far better than one that updates blindly.
          PUBKEY: ${{ vars.SENTINELHOST_RELEASE_PUBKEY }}
        run: |
          set -euo pipefail
          if [ -z "${PUBKEY}" ]; then
            echo "::error::SENTINELHOST_RELEASE_PUBKEY is not set. A release built without"
            echo "::error::it cannot verify its successor, so this refuses to build one."
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p dist
          for pair in linux/amd64 linux/arm64; do
            GOOS="${pair%/*}"; GOARCH="${pair#*/}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags "-s -w \
                -X main.version=${VERSION} \
                -X main.commit=${COMMIT} \
                -X main.buildDate=${DATE} \
                -X github.com/thiagoluga/SentinelHost/internal/selfupdate.PublicKey=${PUBKEY}" \
              -o "dist/sentinelhost-${GOOS}-${GOARCH}" ./cmd/sentinelhost
          done
          cd dist && sha256sum sentinelhost-linux-* > SHA256SUMS

      # Signed with Go rather than a shell tool: the key format has to match exactly what
      # selfupdate.Verify expects, and a mismatch that only shows up on a user's first
      # update is the worst possible place to discover it.
      - name: Sign each asset
        env:
          PRIVKEY: ${{ secrets.SENTINELHOST_RELEASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVKEY}" ]; then
            echo "::error::SENTINELHOST_RELEASE_KEY is not set; refusing to publish unsigned assets."
            exit 1
          fi
          cat > /tmp/sign.go <<'EOF'
          package main

          import (
          	"crypto/ed25519"
          	"encoding/base64"
          	"fmt"
          	"os"
          )

          func main() {
          	key, err := base64.StdEncoding.DecodeString(os.Getenv("PRIVKEY"))
          	if err != nil || len(key) != ed25519.PrivateKeySize {
          		fmt.Fprintln(os.Stderr, "the release key is not a base64 ed25519 private key")
          		os.Exit(1)
          	}
          	for _, path := range os.Args[1:] {
          		payload, err := os.ReadFile(path)
          		if err != nil {
          			fmt.Fprintln(os.Stderr, err)
          			os.Exit(1)
          		}
          		sig := ed25519.Sign(ed25519.PrivateKey(key), payload)
          		out := path + ".sig"
          		if err := os.WriteFile(out, []byte(base64.StdEncoding.EncodeToString(sig)), 0o644); err != nil {
          			fmt.Fprintln(os.Stderr, err)
          			os.Exit(1)
          		}
          		fmt.Println("signed", out)
          	}
          }
          EOF
          go run /tmp/sign.go dist/sentinelhost-linux-amd64 dist/sentinelhost-linux-arm64

      # The signature is verified here, against the public key that was compiled in. A
      # release whose own binary would refuse it must not reach anybody: this is the one
      # place the mistake is cheap to find.
      - name: The published binary would accept its own signature
        env:
          PUBKEY: ${{ vars.SENTINELHOST_RELEASE_PUBKEY }}
        run: |
          set -euo pipefail
          cat > /tmp/verify.go <<'EOF'
          package main

          import (
          	"crypto/ed25519"
          	"encoding/base64"
          	"fmt"
          	"os"
          	"strings"
          )

          func main() {
          	pub, err := base64.StdEncoding.DecodeString(os.Getenv("PUBKEY"))
          	if err != nil || len(pub) != ed25519.PublicKeySize {
          		fmt.Fprintln(os.Stderr, "the public key is not a base64 ed25519 public key")
          		os.Exit(1)
          	}
          	for _, path := range os.Args[1:] {
          		payload, _ := os.ReadFile(path)
          		raw, err := os.ReadFile(path + ".sig")
          		if err != nil {
          			fmt.Fprintln(os.Stderr, err)
          			os.Exit(1)
          		}
          		sig, err := base64.StdEncoding.DecodeString(strings.TrimSpace(string(raw)))
          		if err != nil || !ed25519.Verify(pub, payload, sig) {
          			fmt.Fprintf(os.Stderr, "%s does NOT verify against the published key\n", path)
          			os.Exit(1)
          		}
          		fmt.Println("verified", path)
          	}
          }
          EOF
          go run /tmp/verify.go dist/sentinelhost-linux-amd64 dist/sentinelhost-linux-arm64

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            dist/sentinelhost-linux-amd64 \
            dist/sentinelhost-linux-amd64.sig \
            dist/sentinelhost-linux-arm64 \
            dist/sentinelhost-linux-arm64.sig \
            dist/SHA256SUMS
