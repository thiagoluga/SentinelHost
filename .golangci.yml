# Formato v1, que e o que a golangci-lint-action instala por padrao.
# Trocar para o formato v2 exigiria fixar uma versao especifica da ferramenta
# no CI, e um lint que so roda numa versao exata quebra para quem contribui.

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - misspell
    - revive
    - unconvert
    - nolintlint
    - gofmt

linters-settings:
  gosec:
    excludes:
      # G204: o projeto INTEIRO existe para executar engines externos como
      # subprocesso. Os argumentos sao montados em internal/exec, que resolve
      # o binario e nunca passa por shell.
      - G204
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
