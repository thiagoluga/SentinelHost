# Formato v1, que e o que a golangci-lint-action instala por padrao.
# Trocar para o formato v2 exigiria fixar uma versao especifica da ferramenta
# no CI, e um lint que so roda numa versao exata quebra para quem contribui.

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec
    - revive
    - unconvert
    - nolintlint
    - gofmt

  # `misspell` fica de fora: ele so conhece ingles, e o codigo deste projeto e
  # escrito em portugues. Ele acusa `problemas` como erro de `problems`,
  # `independente` como erro de `independence` e `eles` como erro de `eels`.
  # Manter um linter que exige renomear identificadores corretos para palavras
  # erradas treina todo mundo a ignorar o lint.

linters-settings:
  gosec:
    excludes:
      # G204: o projeto INTEIRO existe para executar engines externos como
      # subprocesso. Os argumentos sao montados em internal/exec, que resolve
      # o binario e nunca passa por shell.
      - G204
      # G501: o MD5 e obrigatorio por INTEROPERABILIDADE, nao por escolha. A
      # API de checksums do WordPress.org publica MD5, e a comparacao tem que
      # usar o mesmo algoritmo que a fonte. Nao ha uso criptografico: o MD5
      # so serve para casar com o valor publicado, e o hash que entra no
      # esquema normalizado e SHA-256, calculado na mesma leitura do arquivo.
      - G501
  revive:
    rules:
      - name: exported
        disabled: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
