# Reviewed against the checklist in catalog/README.md.
#
# The one that matters: these rules were read for anything matching a file every WordPress
# site has. `grep -ci 'wp-config|wp-load|wp-settings'` returns 0, and the rules are
# structured around a payload plus an input vector rather than around filenames — a rule
# that fired on wp-config.php would make SentinelHost quarantine every site that installed
# this, which is a far better attack than writing a webshell.
#
# LICENCE: CC-BY-NC-4.0. Non-commercial. A hosting company installing this across customer
# accounts would be violating it, which is why the panel shows the licence before
# installing rather than filing it as metadata.
